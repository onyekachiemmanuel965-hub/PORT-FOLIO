<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Tiles and Marble</title>
  <desc id="desc">Luxury tiles and marble showroom themed placeholder artwork.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg3)"/>
  <rect x="120" y="150" width="960" height="500" rx="30" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.25)"/>
  <g opacity="0.9">
    <rect x="180" y="220" width="180" height="180" rx="14" fill="url(#stone)"/>
    <rect x="390" y="220" width="180" height="180" rx="14" fill="rgba(255,255,255,0.4)"/>
    <rect x="600" y="220" width="180" height="180" rx="14" fill="rgba(209,250,229,0.35)"/>
    <rect x="810" y="220" width="180" height="180" rx="14" fill="rgba(253,230,138,0.35)"/>
    <rect x="180" y="430" width="180" height="180" rx="14" fill="rgba(252,211,77,0.22)"/>
    <rect x="390" y="430" width="180" height="180" rx="14" fill="rgba(255,255,255,0.26)"/>
    <rect x="600" y="430" width="180" height="180" rx="14" fill="rgba(148,163,184,0.28)"/>
    <rect x="810" y="430" width="180" height="180" rx="14" fill="rgba(255,255,255,0.18)"/>
  </g>
  <circle cx="930" cy="170" r="90" fill="rgba(255,255,255,0.08)"/>
  <text x="130" y="705" fill="#f8fafc" font-size="60" font-family="Arial, Helvetica, sans-serif" font-weight="700">TILES &amp; MARBLE</text>
</svg>
